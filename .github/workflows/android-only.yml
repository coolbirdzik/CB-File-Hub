name: Android Only Release
run-name: Android only · ${{ github.ref_name }} · ${{ inputs.play_track }}

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track (internal, alpha, beta, production, or internalsharing)"
        type: string
        required: true
        default: "internal"
      play_status:
        description: "Google Play release status"
        type: choice
        required: true
        default: "completed"
        options:
          - completed
          - draft

permissions:
  contents: read

# Resolve the version code again for each run, after the previous run finishes.
concurrency:
  group: android-only-google-play-${{ github.repository }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.2"
  PROJECT_DIR: "cb_file_manager"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME || 'com.cbv.filehub' }}
    steps:
      - name: Checkout selected branch or tag
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Validate Google Play release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GOOGLE_PLAY_PACKAGE_NAME PLAY_TRACK; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Google Play release config: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate release tooling and Google Play listings
        run: |
          node --test scripts/check_android_page_sizes.test.mjs scripts/tests/store_listings.test.mjs scripts/tests/google_play_listings.test.mjs
          node scripts/store_listings.mjs > "$RUNNER_TEMP/store-listings-preview.json"

      - name: Read version without changing pubspec or tags
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pubspec = fs.readFileSync(`${process.env.PROJECT_DIR}/pubspec.yaml`, 'utf8');
          const version = /^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$/m.exec(pubspec);
          if (!version) throw new Error('Expected pubspec version: major.minor.patch+build');
          const minimum = Number(version[2]) + 1;
          if (!Number.isSafeInteger(minimum)) throw new Error('Invalid pubspec build number');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_name=${version[1]}\nmin_version_code=${minimum}\n`);
          NODE

      - name: Resolve next Android version code from Google Play
        id: android_version
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MIN_ANDROID_VERSION_CODE: ${{ steps.version.outputs.min_version_code }}
        run: |
          VERSION_CODE="$(node scripts/google_play_next_version_code.mjs)"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionCode resolved to $VERSION_CODE"

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: cb_file_manager
        run: flutter pub get

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/android-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Setup Rust Android targets (cb_native)
        run: bash scripts/ci/setup_rust_android.sh

      - name: Build signed Android AAB
        working-directory: cb_file_manager
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          ANDROID_APPLICATION_ID: ${{ env.GOOGLE_PLAY_PACKAGE_NAME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_SERVER_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE" \
            --dart-define=GOOGLE_DRIVE_CLIENT_ID="$GOOGLE_DRIVE_CLIENT_ID" \
            --dart-define=GOOGLE_DRIVE_CLIENT_SECRET="$GOOGLE_DRIVE_CLIENT_SECRET" \
            --dart-define=GOOGLE_DRIVE_SERVER_CLIENT_ID="$GOOGLE_DRIVE_SERVER_CLIENT_ID" \
            --dart-define=DROPBOX_APP_KEY="$DROPBOX_APP_KEY" \
            --dart-define=ONEDRIVE_CLIENT_ID="$ONEDRIVE_CLIENT_ID"

      - name: Verify Android 16 KB page size support
        run: node scripts/check_android_page_sizes.mjs "$PROJECT_DIR/build/app/outputs/bundle/release/app-release.aab"

      - name: Name AAB with Android version code
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          cd "$PROJECT_DIR/build/app/outputs/bundle/release"
          mv app-release.aab "CBFileHub-$VERSION_NAME-$VERSION_CODE.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-aab-${{ steps.version.outputs.version_name }}-${{ steps.android_version.outputs.version_code }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Prepare Google Play descriptions and images
        id: play_listing
        if: inputs.play_track != 'internalsharing'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          STORE_LISTINGS_DIR: store/listings
          GOOGLE_PLAY_UPDATE_IMAGES: ${{ vars.GOOGLE_PLAY_UPDATE_IMAGES || 'true' }}
        run: |
          EDIT_ID="$(node scripts/google_play_listings.mjs prepare)"
          echo "edit_id=$EDIT_ID" >> "$GITHUB_OUTPUT"

      - name: Submit Android release to Google Play
        id: submit_play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          releaseName: v${{ steps.version.outputs.version_name }} (${{ steps.android_version.outputs.version_code }})
          existingEditId: ${{ steps.play_listing.outputs.edit_id }}

      - name: Discard uncommitted Google Play edit after a failed upload
        if: always() && steps.play_listing.outputs.edit_id != '' && steps.submit_play.outcome != 'success'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_EDIT_ID: ${{ steps.play_listing.outputs.edit_id }}
        run: node scripts/google_play_listings.mjs discard

      - name: Summarize Android release
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          PLAY_TRACK: ${{ inputs.play_track }}
          PLAY_STATUS: ${{ inputs.play_status }}
        run: |
          {
            echo "### Android release uploaded"
            echo "- Version: $VERSION_NAME ($VERSION_CODE)"
            echo "- Track: $PLAY_TRACK"
            echo "- Status: $PLAY_STATUS"
            echo "- Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
