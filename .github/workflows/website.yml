name: Website

# Builds the coolbird.net site (website/, Gatsby) on its own, without the app.
# Every run typechecks and builds; deploying to Cloudflare Pages happens only
# when started by hand with "deploy" ticked. Releases still redeploy the site
# from release.yml (deploy-website job).

on:
  push:
    branches: [main, develop]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the build to Cloudflare Pages (production)"
        type: boolean
        default: false

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Refreshes src/data/releases.json so download links and /releases match
      # the latest GitHub release, the same as a release deploy does.
      - name: Fetch release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run releases

      - name: Build site
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website
          path: website/public
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required to deploy."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Only for the wrangler CLI pinned in package-lock.json.
      - name: Install website dependencies
        run: npm ci

      - name: Download site
        uses: actions/download-artifact@v8.0.1
        with:
          name: website
          path: website/public

      # Publishes the exact files the build job produced to the production branch.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy --branch=main --commit-dirty=true
