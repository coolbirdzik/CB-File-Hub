name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run every E2E suite and ignore recorded passes'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.2'
  PROJECT_DIR: 'cb_file_manager'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # OAuth client ids for Backup & Sync (see docs/features/08-cloud-backup-sync.md).
  # Unset secrets (e.g. fork PRs) resolve to "" and the build still succeeds.
  GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
  GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
  GOOGLE_DRIVE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_SERVER_CLIENT_ID }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

jobs:
  store-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Validate shared Store descriptions and submission scripts
        run: node --test scripts/tests/store_listings.test.mjs scripts/tests/google_play_listings.test.mjs
      - name: Validate E2E suite selection rules
        run: node --test scripts/tests/e2e_select.test.mjs

  # Analyze and test
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Check formatting, analysis and unit/widget tests
        run: bash scripts/check_quality.sh

  # Picks the E2E suites this change needs, so unrelated pushes skip the
  # Windows E2E job. Pushes/PRs to main run every suite; develop diffs against
  # its last green run. Suites that already passed on the same source
  # fingerprint are skipped. Rules: cb_file_manager/integration_test/e2e_impact.json.
  # Force a full run with workflow_dispatch (full_e2e), the `e2e:full` PR label
  # or `[e2e full]` in the head commit message.
  e2e-select:
    name: Select E2E suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      suites: ${{ steps.select.outputs.suites }}
      fingerprint: ${{ steps.select.outputs.fingerprint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Select suites
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/e2e_select.mjs

  # Desktop E2E (integration_test on Windows; requires --dart-define=CB_E2E=true)
  e2e-windows:
    name: E2E integration tests (Windows)
    runs-on: windows-latest
    needs: [analyze, e2e-select]
    if: needs.e2e-select.outputs.run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Patch pdfx CMake compatibility
        shell: pwsh
        run: |
          $pdfxDir = "${{ env.PROJECT_DIR }}/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows"
          Get-ChildItem -Path $pdfxDir -Include "*.cmake","*.txt","*.in" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-9.]+\)', 'cmake_minimum_required(VERSION 3.14)' | Set-Content $_.FullName
          }

      # The fetch scripts verify SHA-256 and skip when the cached files match.
      - name: Cache llama.cpp and aria2 runtimes
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/windows/llama
            ${{ env.PROJECT_DIR }}/windows/aria2
          key: windows-runtimes-${{ hashFiles('scripts/fetch_llama_runtime.sh', 'scripts/fetch_aria2_runtime.sh') }}

      # The llama.cpp runtime (Vulkan DLLs + llama-server.exe) is not committed
      # to git. The integration test build runs CMake's INSTALL target, which
      # bundles these DLLs, so they must be present before the app is built.
      - name: Fetch llama.cpp and aria2 runtimes
        shell: bash
        run: |
          bash scripts/fetch_llama_runtime.sh
          bash scripts/fetch_aria2_runtime.sh

      # Flutter desktop integration_test does NOT support multiple test files
      # in one `flutter test integration_test` invocation, so e2e_run.mjs runs
      # one process per suite and kills stray cb_file_hub.exe between them.
      # It keeps going after a failure so every regression shows up in one run.
      # showcase_screenshots_e2e_test (marketing screenshots) and the other
      # files under "notInCi" in e2e_impact.json are intentionally not run here.
      # See: cb_file_manager/integration_test/app_e2e_test.dart header.
      - name: Run selected E2E suites
        id: run
        run: node scripts/ci/e2e_run.mjs --suites "${{ needs.e2e-select.outputs.suites }}"

      # Keep the machine-readable test events after a failure. The default
      # reporter only leaves GitHub with an aggregate count, which makes a
      # Windows-only E2E regression impossible to diagnose from the job.
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ env.PROJECT_DIR }}/build/e2e_report.jsonl
            ${{ env.PROJECT_DIR }}/build/e2e_report/
            ${{ env.PROJECT_DIR }}/build/e2e_failed_tests.txt
            ${{ env.PROJECT_DIR }}/build/e2e-logs/
            ${{ env.PROJECT_DIR }}/build/e2e-media-kit-ci.jsonl
            ${{ env.PROJECT_DIR }}/build/e2e-media-kit/
            ${{ env.PROJECT_DIR }}/build/e2e-torrent-ci.jsonl

      # The cache key is the record: e2e_select.mjs lists `e2e-pass-<fingerprint>-*`
      # keys and skips those suites when the same source is tested again.
      - name: Write E2E pass marker
        if: always() && steps.run.outputs.passed != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-pass-marker"
          echo "${{ steps.run.outputs.passed }} passed at ${{ github.sha }}" > "$RUNNER_TEMP/e2e-pass-marker/passed.txt"

      - name: Record passed suites
        if: always() && steps.run.outputs.passed != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/e2e-pass-marker
          key: e2e-pass-${{ needs.e2e-select.outputs.fingerprint }}-${{ steps.run.outputs.passed }}

  # Build Windows
  build-windows:
    runs-on: windows-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Patch pdfx CMake compatibility
        shell: pwsh
        run: |
          $pdfxDir = "${{ env.PROJECT_DIR }}/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows"
          Get-ChildItem -Path $pdfxDir -Include "*.cmake","*.txt","*.in" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-9.]+\)', 'cmake_minimum_required(VERSION 3.14)' | Set-Content $_.FullName
          }

      - name: Cache llama.cpp and aria2 runtimes
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/windows/llama
            ${{ env.PROJECT_DIR }}/windows/aria2
          key: windows-runtimes-${{ hashFiles('scripts/fetch_llama_runtime.sh', 'scripts/fetch_aria2_runtime.sh') }}

      # The llama.cpp runtime (Vulkan DLLs + llama-server.exe) is not committed
      # to git; fetch it before building so CMake can bundle it.
      - name: Fetch llama.cpp and aria2 runtimes
        shell: bash
        run: |
          bash scripts/fetch_llama_runtime.sh
          bash scripts/fetch_aria2_runtime.sh

      - name: Build Windows
        shell: bash
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build windows --release --dart-define=GOOGLE_DRIVE_CLIENT_ID="$GOOGLE_DRIVE_CLIENT_ID" --dart-define=GOOGLE_DRIVE_CLIENT_SECRET="$GOOGLE_DRIVE_CLIENT_SECRET" --dart-define=GOOGLE_DRIVE_SERVER_CLIENT_ID="$GOOGLE_DRIVE_SERVER_CLIENT_ID" --dart-define=DROPBOX_APP_KEY="$DROPBOX_APP_KEY" --dart-define=ONEDRIVE_CLIENT_ID="$ONEDRIVE_CLIENT_ID"

  # Build Android
  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --dart-define=GOOGLE_DRIVE_CLIENT_ID="$GOOGLE_DRIVE_CLIENT_ID" --dart-define=GOOGLE_DRIVE_CLIENT_SECRET="$GOOGLE_DRIVE_CLIENT_SECRET" --dart-define=GOOGLE_DRIVE_SERVER_CLIENT_ID="$GOOGLE_DRIVE_SERVER_CLIENT_ID" --dart-define=DROPBOX_APP_KEY="$DROPBOX_APP_KEY" --dart-define=ONEDRIVE_CLIENT_ID="$ONEDRIVE_CLIENT_ID"

