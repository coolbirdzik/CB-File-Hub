name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.41.5'
  PROJECT_DIR: 'cb_file_manager'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Analyze and test
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Verify formatting
        run: |
          cd ${{ env.PROJECT_DIR }}
          dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter analyze

      - name: Run tests
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter test

  # Desktop E2E (integration_test on Windows; requires --dart-define=CB_E2E=true)
  e2e-windows:
    name: E2E integration tests (Windows)
    runs-on: windows-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Patch pdfx CMake compatibility
        shell: pwsh
        run: |
          $pdfxDir = "${{ env.PROJECT_DIR }}/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows"
          Get-ChildItem -Path $pdfxDir -Filter "*.cmake","*.txt","*.in" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-9.]+\)', 'cmake_minimum_required(VERSION 3.14)' | Set-Content $_.FullName
          }

      - name: Stop stray cb_file_hub.exe
        shell: cmd
        run: taskkill /F /IM cb_file_hub.exe /T 2>nul & exit /b 0

      # Flutter desktop integration_test does NOT support multiple test files
      # in one `flutter test integration_test` invocation: each file launches
      # its own cb_file_hub.exe and the second/third launch fails with
      # "Error waiting for a debug connection: The log reader stopped
      # unexpectedly, or never started." Run each test file in its own step
      # and kill stray app processes between runs.
      # See: cb_file_manager/integration_test/app_e2e_test.dart header,
      #      cb_file_manager/tool/e2e_parallel.dart header.

      - name: Run integration tests - app_e2e_test
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter test integration_test/app_e2e_test.dart -d windows --dart-define=CB_E2E=true

      - name: Stop stray cb_file_hub.exe (after app_e2e_test)
        if: always()
        shell: cmd
        run: taskkill /F /IM cb_file_hub.exe /T 2>nul & exit /b 0

      # showcase_screenshots_e2e_test is a marketing screenshot generator, not a
      # functional test suite. It is intentionally skipped on CI -- run it
      # locally with `flutter test integration_test/showcase_screenshots_e2e_test.dart`
      # when refreshing marketing screenshots.

      - name: Run integration tests - video_thumbnails_e2e_test
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter test integration_test/video_thumbnails_e2e_test.dart -d windows --dart-define=CB_E2E=true

      - name: Stop stray cb_file_hub.exe (cleanup)
        if: always()
        shell: cmd
        run: taskkill /F /IM cb_file_hub.exe /T 2>nul & exit /b 0

  # Build Windows
  build-windows:
    runs-on: windows-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Patch pdfx CMake compatibility
        shell: pwsh
        run: |
          $pdfxDir = "${{ env.PROJECT_DIR }}/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows"
          Get-ChildItem -Path $pdfxDir -Filter "*.cmake","*.txt","*.in" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-9.]+\)', 'cmake_minimum_required(VERSION 3.14)' | Set-Content $_.FullName
          }

      - name: Build Windows
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build windows --release

  # Build Android
  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release

